# ============================================================================
#  Tengu Aurora - shader properties
# ============================================================================

oldLighting=false
oldHandLight=false
dynamicHandLight=true
separateAo=true
underwaterOverlay=false
vignette=false
sun=false
moon=false
clouds=off
particles.ordering=after
beacon.beam.depth=true
frustum.culling=true
shadowTerrain=true
shadowTranslucent=true
shadowEntities=true
shadowBlockEntities=true

# water is composited in composite.fsh: keep its data unblended and never alpha-test it away
alphaTest.gbuffers_water=off
blend.gbuffers_water.colortex4=off
blend.shadow=off

# spider eyes / beacon beams overwrite material data so the deferred pass makes them glow
blend.gbuffers_spidereyes.colortex1=off
blend.gbuffers_spidereyes.colortex2=off
blend.gbuffers_beaconbeam.colortex1=off
blend.gbuffers_beaconbeam.colortex2=off

# cold / snowy biomes show the aurora
uniform.float.auroraBiome=smooth(if(in(biome, BIOME_SNOWY_PLAINS, BIOME_SNOWY_TAIGA, BIOME_SNOWY_SLOPES, BIOME_SNOWY_BEACH, BIOME_FROZEN_PEAKS, BIOME_JAGGED_PEAKS, BIOME_GROVE, BIOME_ICE_SPIKES, BIOME_FROZEN_RIVER, BIOME_FROZEN_OCEAN, BIOME_DEEP_FROZEN_OCEAN), 1, 0), 15, 15)

# ---- Profiles ----
profile.LOW=shadowMapResolution=2048 shadowDistance=128.0 VL_STEPS=8 CLOUD_STEPS=12 !SSR
profile.MEDIUM=shadowMapResolution=2048 shadowDistance=160.0 VL_STEPS=12 CLOUD_STEPS=16 SSR
profile.HIGH=shadowMapResolution=3072 shadowDistance=192.0 VL_STEPS=16 CLOUD_STEPS=24 SSR
profile.ULTRA=shadowMapResolution=4096 shadowDistance=256.0 VL_STEPS=24 CLOUD_STEPS=32 SSR

# ---- Menu ----
screen=INFO <profile> <empty> <empty> [LIGHTING] [WORLD] [ATMOSPHERE] [WATER] [POST]
screen.LIGHTING=shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS EMISSIVE_STRENGTH GLOWING_ORES
screen.WORLD=WAVING_PLANTS WAVE_SPEED WAVE_AMOUNT LAVA_WAVES RAIN_PUDDLES PUDDLE_AMOUNT
screen.ATMOSPHERE=VOLUMETRIC_FOG VL_STEPS FOG_DENSITY GODRAY_STRENGTH CLOUDS CLOUD_COVERAGE CLOUD_STEPS <empty> AURORA AURORA_EVERYWHERE AURORA_BRIGHTNESS <empty> NETHER_FOG END_FOG
screen.WATER=WATER_WAVE_HEIGHT WATER_CAUSTICS SSR SHORE_FOAM
screen.POST=TAA SHARPEN BLOOM_STRENGTH EXPOSURE SATURATION VIBRANCE CONTRAST VIGNETTE_STRENGTH

sliders=shadowMapResolution shadowDistance SHADOW_SOFTNESS sunPathRotation SUN_BRIGHTNESS AMBIENT_BRIGHTNESS BLOCKLIGHT_BRIGHTNESS EMISSIVE_STRENGTH WAVE_SPEED WAVE_AMOUNT PUDDLE_AMOUNT VL_STEPS FOG_DENSITY GODRAY_STRENGTH CLOUD_COVERAGE CLOUD_STEPS AURORA_BRIGHTNESS NETHER_FOG END_FOG WATER_WAVE_HEIGHT SHARPEN BLOOM_STRENGTH EXPOSURE SATURATION VIBRANCE CONTRAST VIGNETTE_STRENGTH
